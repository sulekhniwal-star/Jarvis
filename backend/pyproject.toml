[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-backend"
version = "0.1.0"
description = "Project Jarvis — Personal Cloud-Coordinated Autonomous AI Engineering Platform (Control Plane)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
    { name = "Project Jarvis Architectural Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "psycopg[binary,pool]>=3.2.3",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0.2",
    "cryptography>=43.0.3",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "python-telegram-bot>=21.6",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.2",
    "mypy>=1.13.0",
]
ai-providers = [
    "google-genai>=0.8.0",
    "openai>=1.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

services:
  - type: web
    name: jarvis-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health/live
    disk:
      name: jarvis-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/jarvis.db
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AUTHORIZED_TELEGRAM_USER_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_TARGET_ORG
        value: sulekhniwal-star
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

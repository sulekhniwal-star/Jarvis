version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: jarvis-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - jarvis-workspaces:/app/workspaces

  worker:
    build:
      context: ./docker
      dockerfile: Dockerfile.worker
    container_name: jarvis-worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    volumes:
      - jarvis-workspaces:/workspace:rw
    security_opt:
      - no-new-privileges:true

volumes:
  jarvis-workspaces:
    driver: local

